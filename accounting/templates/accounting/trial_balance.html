<!DOCTYPE html>
<html>
<head><title>Trial Balance - SimpleRentalBooks</title></head>
<body>
    <h1>Trial Balance</h1>

    <form method="get">
        <label>Property:</label>
        <select name="property">
            <option value="">All</option>
            {% for prop in properties %}
                <option value="{{ prop.id }}">{{ prop.name }}</option>
            {% endfor %}
        </select>
        <label>LLC:</label>
        <select name="llc">
            <option value="">All</option>
            {% for llc in llcs %}
                <option value="{{ llc.id }}">{{ llc.name }}</option>
            {% endfor %}
        </select>
        <label>As of:</label><input type="date" name="as_of_date" value="{{ as_of_date }}">
        <button type="submit">Filter</button>
    </form>

    <hr>

    <table border="1">
        <tr><th>Account</th><th>Debit</th><th>Credit</th></tr>
        {% for item in report_data %}
            <tr>
                <td>{{ item.name }}</td>
                <td>${{ item.debit }}</td>
                <td>${{ item.credit }}</td>
            </tr>
        {% endfor %}
        <tr><td><strong>Total</strong></td><td><strong>${{ total_debit }}</strong></td><td><strong>${{ total_credit }}</strong></td></tr>
    </table>

    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
