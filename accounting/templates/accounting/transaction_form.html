{% extends 'accounting/base.html' %}

{% block title %}Add Transaction - SimpleRentalBooks{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h1 class="h3 mb-4">Add Transaction</h1>
            <form method="post" id="transactionForm">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Transaction</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Category Number / Code</label>
                    <input type="text" id="new_cat_code" class="form-control" placeholder="e.g. 4000">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" id="new_cat_name" class="form-control" placeholder="e.g. Rental Income">
                </div>
                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select id="new_cat_type" class="form-select">
                        <option value="ASSET">Asset</option>
                        <option value="LIABILITY">Liability</option>
                        <option value="EQUITY">Equity</option>
                        <option value="INCOME">Income</option>
                        <option value="EXPENSE" selected>Expense</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="addCategory()">Add Category</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input, select, textarea').forEach(el => {
            if (el.type !== 'checkbox' && el.type !== 'radio') {
                el.classList.add('form-control');
            }
        });

        // Add "Add New..." option to category select
        const categorySelect = document.querySelector('select[name="category"]');
        if (categorySelect) {
            const addNewOption = new Option("--- Add New Category ---", "ADD_NEW");
            categorySelect.add(addNewOption, categorySelect.options[0]);

            categorySelect.addEventListener('change', function() {
                if (this.value === 'ADD_NEW') {
                    const modal = new bootstrap.Modal(document.getElementById('addCategoryModal'));
                    modal.show();
                    this.value = ''; // Reset select
                }
            });
        }
    });

    async function addCategory() {
        const code = document.getElementById('new_cat_code').value;
        const name = document.getElementById('new_cat_name').value;
        const type = document.getElementById('new_cat_type').value;
        if (!name) return;

        const response = await fetch("{% url 'add_account_ajax' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `name=${encodeURIComponent(name)}&account_type=${encodeURIComponent(type)}&code=${encodeURIComponent(code)}`
        });

        if (response.ok) {
            const data = await response.json();
            const select = document.querySelector('select[name="category"]');
            const option = new Option(data.name, data.id, true, true);
            select.add(option);

            // Close modal
            bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
            // Clear inputs
            document.getElementById('new_cat_code').value = '';
            document.getElementById('new_cat_name').value = '';
        } else {
            alert("Error adding category");
        }
    }
</script>
{% endblock %}
