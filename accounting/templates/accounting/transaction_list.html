<!DOCTYPE html>
<html>
<head>
    <title>Transactions - SimpleRentalBooks</title>
</head>
<body>
    <h1>Transactions</h1>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Property</th>
            <th>Category</th>
        </tr>
        {% for tx in transactions %}
        <tr>
            <td>{{ tx.date }}</td>
            <td>{{ tx.description }}</td>
            <td>{{ tx.amount }}</td>
            <td>{{ tx.property.name }}</td>
            <td>{{ tx.category.name }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
