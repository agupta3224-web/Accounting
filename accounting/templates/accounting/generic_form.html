{% extends 'accounting/base.html' %}

{% block title %}{{ title }} - SimpleRentalBooks{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h1 class="h3 mb-4">{{ title }}</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Apply Bootstrap classes to Django form inputs
    document.querySelectorAll('input, select, textarea').forEach(el => {
        if (el.type !== 'checkbox' && el.type !== 'radio' && el.type !== 'file') {
            el.classList.add('form-control');
        } else if (el.type === 'file') {
            el.classList.add('form-control');
        }
    });
</script>
{% endblock %}
