<!DOCTYPE html>
<html>
<head><title>Chart of Accounts - SimpleRentalBooks</title></head>
<body>
    <h1>Chart of Accounts</h1>
    <a href="{% url 'add_account' %}">Add New Account</a>
    <hr>
    <table border="1">
        <tr><th>Code</th><th>Name</th><th>Type</th><th>Description</th></tr>
        {% for acc in accounts %}
        <tr>
            <td>{{ acc.code|default:"" }}</td>
            <td>{{ acc.name }}</td>
            <td>{{ acc.account_type }}</td>
            <td>{{ acc.description }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
